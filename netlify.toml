# Despliegue en Netlify: si el repositorio contiene la carpeta `website/`,
# configura "Base directory" = website en el panel de Netlify.
[build]
  command = "node build.js"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
